<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/book_edit.css' %}">
</head>
<body>
    <div class="container">
        <h1>Edit Book</h1>
        <form method="post" class="book-form">
            {% csrf_token %}

            <label for="title">Title:</label>
            <input type="text" id="title" name="title" value="{{ book.title }}" required>

            <label for="issn">ISSN:</label>
            <input type="text" id="issn" name="issn" value="{{ book.issn }}" required>

            <label for="publish_date">Publish Date:</label>
            <input type="date" id="publish_date" name="publish_date" value="{{ book.publish_date }}" required>

            <label for="stock">Stock:</label>
            <input type="number" id="stock" name="stock" value="{{ book.stock }}" required>

            <label for="category">Category:</label>
            <input type="text" id="category" name="category" value="{{ book.category }}" placeholder="e.g., Fiction, Non-fiction" required>

            <button type="submit" class="submit-btn">Save</button>
        </form>
    </div>
    <script src="{% static '/js/book_edit.js' %}"></script>
</body>
</html>
